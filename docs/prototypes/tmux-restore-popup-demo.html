<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prowl Restore Cards Demo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #17181c;
        --panel: #25262b;
        --panel-2: #2d2e34;
        --panel-3: #36373f;
        --text: #f4f4f5;
        --muted: #a7a8ad;
        --faint: #777982;
        --line: rgba(255, 255, 255, 0.1);
        --accent: #ff3f9a;
        --accent-2: #d92b7d;
        --accent-soft: rgba(255, 63, 154, 0.16);
        --danger: #ff6b5d;
        --shadow: 0 28px 90px rgba(0, 0, 0, 0.52), 0 8px 24px rgba(0, 0, 0, 0.32);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 18% 12%, rgba(59, 130, 246, 0.2), transparent 26%),
          radial-gradient(circle at 82% 68%, rgba(255, 63, 154, 0.12), transparent 30%),
          linear-gradient(135deg, #15161a, #202126 52%, #15161a);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 40px;
      }

      .canvas {
        position: fixed;
        inset: 0;
        opacity: 0.4;
        pointer-events: none;
      }

      .card-ghost {
        position: absolute;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
      }

      .card-ghost:nth-child(1) {
        left: 7%;
        top: 8%;
        width: 42%;
        height: 38%;
      }

      .card-ghost:nth-child(2) {
        right: 6%;
        top: 10%;
        width: 40%;
        height: 36%;
      }

      .card-ghost:nth-child(3) {
        left: 8%;
        bottom: 10%;
        width: 41%;
        height: 34%;
      }

      .restore-dialog {
        width: min(920px, calc(100vw - 48px));
        height: min(680px, calc(100vh - 48px));
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 14px;
        background: rgba(37, 38, 43, 0.96);
        box-shadow: var(--shadow);
        backdrop-filter: blur(28px) saturate(150%);
      }

      header {
        padding: 22px 24px 18px;
        border-bottom: 1px solid var(--line);
      }

      .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: 0;
      }

      .count-pill {
        min-width: 92px;
        height: 30px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.04);
        font-size: 13px;
        white-space: nowrap;
      }

      .search {
        width: 100%;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
        background: rgba(0, 0, 0, 0.18);
        padding: 0 14px;
        font: inherit;
        outline: none;
      }

      .search:focus {
        border-color: rgba(255, 63, 154, 0.7);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      main {
        min-height: 0;
        overflow-y: auto;
        padding: 14px;
      }

      .group-label {
        padding: 10px 10px 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .restore-list {
        display: grid;
        gap: 8px;
      }

      .restore-row {
        width: 100%;
        min-height: 96px;
        border: 1px solid transparent;
        border-radius: 8px;
        color: inherit;
        background: transparent;
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) auto;
        gap: 14px;
        align-items: center;
        padding: 14px 16px;
        text-align: left;
        cursor: pointer;
      }

      .restore-row:hover {
        background: rgba(255, 255, 255, 0.06);
      }

      .restore-row[aria-selected="true"] {
        border-color: rgba(255, 63, 154, 0.65);
        background: linear-gradient(135deg, rgba(255, 63, 154, 0.86), rgba(205, 42, 122, 0.86));
      }

      .restore-row[aria-selected="true"] .meta,
      .restore-row[aria-selected="true"] .time,
      .restore-row[aria-selected="true"] .path {
        color: rgba(255, 255, 255, 0.82);
      }

      .restore-row.disabled {
        cursor: default;
        opacity: 0.5;
      }

      .restore-row.disabled:hover {
        background: transparent;
      }

      .check {
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 6px;
        color: transparent;
        background: rgba(255, 255, 255, 0.06);
        font-size: 15px;
        font-weight: 800;
      }

      .restore-row[aria-selected="true"] .check {
        color: white;
        border-color: rgba(255, 255, 255, 0.6);
        background: rgba(255, 255, 255, 0.22);
      }

      .row-title {
        margin: 0 0 5px;
        font-size: 18px;
        line-height: 1.2;
        font-weight: 750;
        letter-spacing: 0;
      }

      .meta,
      .path {
        overflow: hidden;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.38;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .meta strong {
        color: inherit;
        font-weight: 700;
      }

      .right {
        min-width: 118px;
        display: grid;
        justify-items: end;
        gap: 8px;
      }

      .shortcut {
        color: inherit;
        font-size: 15px;
        font-weight: 700;
      }

      .time {
        color: var(--faint);
        font-size: 12px;
        white-space: nowrap;
      }

      .state {
        height: 24px;
        display: inline-flex;
        align-items: center;
        padding: 0 9px;
        border-radius: 999px;
        color: #ffd5e8;
        background: rgba(255, 255, 255, 0.12);
        font-size: 12px;
        font-weight: 700;
      }

      .empty {
        display: none;
        height: 100%;
        place-items: center;
        color: var(--muted);
        font-size: 14px;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 18px;
        border-top: 1px solid var(--line);
        background: rgba(0, 0, 0, 0.18);
      }

      .selection-summary {
        min-width: 0;
        color: var(--muted);
        font-size: 13px;
      }

      .actions {
        display: flex;
        gap: 10px;
      }

      button.action {
        min-width: 92px;
        height: 38px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.06);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button.action:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      button.primary {
        min-width: 152px;
        border-color: transparent;
        background: var(--accent);
        color: white;
      }

      button.primary:hover {
        background: var(--accent-2);
      }

      button.primary:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%) translateY(18px);
        opacity: 0;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #2b2c31;
        color: var(--text);
        box-shadow: 0 14px 38px rgba(0, 0, 0, 0.38);
        transition: opacity 160ms ease, transform 160ms ease;
        pointer-events: none;
      }

      .toast.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      @media (max-width: 720px) {
        body {
          padding: 16px;
        }

        .restore-dialog {
          width: 100%;
          height: calc(100vh - 32px);
        }

        .restore-row {
          grid-template-columns: 30px minmax(0, 1fr);
        }

        .right {
          grid-column: 2;
          min-width: 0;
          justify-items: start;
          grid-template-columns: auto auto;
        }

        footer {
          align-items: stretch;
          flex-direction: column;
        }

        .actions {
          justify-content: flex-end;
        }
      }
    </style>
  </head>
  <body>
    <div class="canvas" aria-hidden="true">
      <div class="card-ghost"></div>
      <div class="card-ghost"></div>
      <div class="card-ghost"></div>
    </div>

    <section class="restore-dialog" aria-label="Restore detached cards">
      <header>
        <div class="title-row">
          <h1>Restore Cards</h1>
          <div class="count-pill" id="availableCount">6 available</div>
        </div>
        <input class="search" id="search" type="search" placeholder="Filter cards by title, path, or window" />
      </header>

      <main>
        <div class="group-label">Detached Cards</div>
        <div class="restore-list" id="restoreList"></div>
        <div class="empty" id="empty">No matching detached cards</div>
      </main>

      <footer>
        <div class="selection-summary" id="summary">No cards selected</div>
        <div class="actions">
          <button class="action" id="cancelButton" type="button">Cancel</button>
          <button class="action primary" id="restoreButton" type="button" disabled>Restore Selected</button>
        </div>
      </footer>
    </section>

    <div class="toast" id="toast"></div>

    <script>
      const cards = [
        {
          id: "7514C85A-8B44-42EB-A3A9-2C0E631957DE",
          title: "yam / yam",
          path: "~",
          runtimeTitle: "Yams-MacBook-Pro.local",
          window: "@17",
          created: "2026-05-29T16:00:33Z",
        },
        {
          id: "0BFA0EB9-32E4-4F9F-B412-B98451F25E1E",
          title: "Prowl / anonymous-tmux-terminals",
          path: "~/Developer/Prowl/.worktrees/anonymous-tmux-terminals",
          runtimeTitle: "feature/anonymous-tmux-terminals",
          window: "@18",
          created: "2026-05-29T12:24:09Z",
        },
        {
          id: "F04380B2-A4C9-48DB-9B3B-C93443F840AD",
          title: "TikTok / inbox live data",
          path: "~/Developer/TikTok2",
          runtimeTitle: "Claude",
          window: "@21",
          created: "2026-05-29T11:02:18Z",
        },
        {
          id: "AF1801DC-EE61-4DDD-91CD-FA2769B0F304",
          title: "MarkEdit / MarkEdit",
          path: "~/Developer/MarkEdit",
          runtimeTitle: "Commit Manager",
          window: "@7",
          created: "2026-05-29T06:49:06Z",
        },
        {
          id: "23E5CBEA-864D-47BC-9F11-E0699D8E4E38",
          title: "TikTok / TikTok1",
          path: "~/Developer/TikTok1",
          runtimeTitle: "Yams-MacBook-Pro.local",
          window: "@3",
          created: "2026-05-29T05:33:58Z",
        },
        {
          id: "79B9448B-7958-4D86-B5B3-A36BFE77A231",
          title: "Warlock / launcher",
          path: "~/Developer/Warlock",
          runtimeTitle: "zsh",
          window: "@25",
          created: "2026-05-28T22:31:44Z",
        },
      ];

      const selected = new Set();
      let visibleCards = [...cards];
      let lastClickedIndex = null;
      const list = document.getElementById("restoreList");
      const search = document.getElementById("search");
      const summary = document.getElementById("summary");
      const restoreButton = document.getElementById("restoreButton");
      const cancelButton = document.getElementById("cancelButton");
      const empty = document.getElementById("empty");
      const availableCount = document.getElementById("availableCount");
      const toast = document.getElementById("toast");

      function formatCreated(iso) {
        const date = new Date(iso);
        return new Intl.DateTimeFormat("en", {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        }).format(date);
      }

      function render() {
        list.innerHTML = "";
        availableCount.textContent = `${visibleCards.length} available`;
        empty.style.display = visibleCards.length ? "none" : "grid";

        visibleCards.forEach((card, index) => {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "restore-row";
          row.dataset.id = card.id;
          row.setAttribute("aria-selected", selected.has(card.id) ? "true" : "false");
          row.innerHTML = `
            <div class="check">✓</div>
            <div class="content">
              <p class="row-title">${card.title}</p>
              <div class="path">cwd: ${card.path}</div>
              <div class="meta">
                <strong>title:</strong> ${card.runtimeTitle}
                &nbsp; <strong>window:</strong> ${card.window}
                &nbsp; <strong>card:</strong> ${card.id}
              </div>
            </div>
            <div class="right">
              <div class="shortcut">⌘${index + 1}</div>
              <div class="time">${formatCreated(card.created)}</div>
              <div class="state">Detached</div>
            </div>
          `;

          row.addEventListener("click", (event) => {
            if (event.shiftKey && lastClickedIndex !== null) {
              const start = Math.min(lastClickedIndex, index);
              const end = Math.max(lastClickedIndex, index);
              for (let i = start; i <= end; i += 1) {
                selected.add(visibleCards[i].id);
              }
            } else {
              if (selected.has(card.id)) {
                selected.delete(card.id);
              } else {
                selected.add(card.id);
              }
              lastClickedIndex = index;
            }
            updateSelection();
            render();
          });

          list.appendChild(row);
        });
      }

      function updateSelection() {
        const selectedCount = selected.size;
        summary.textContent =
          selectedCount === 0
            ? "No cards selected"
            : `${selectedCount} card${selectedCount === 1 ? "" : "s"} selected`;
        restoreButton.disabled = selectedCount === 0;
      }

      function filterCards() {
        const query = search.value.trim().toLowerCase();
        visibleCards = cards.filter((card) =>
          [card.title, card.path, card.runtimeTitle, card.window, card.id].some((value) =>
            value.toLowerCase().includes(query)
          )
        );
        lastClickedIndex = null;
        render();
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("visible");
        window.setTimeout(() => toast.classList.remove("visible"), 1800);
      }

      search.addEventListener("input", filterCards);

      cancelButton.addEventListener("click", () => {
        selected.clear();
        updateSelection();
        render();
        showToast("Restore canceled");
      });

      restoreButton.addEventListener("click", () => {
        const selectedTitles = cards.filter((card) => selected.has(card.id)).map((card) => card.title);
        showToast(`Restoring ${selectedTitles.length} card${selectedTitles.length === 1 ? "" : "s"}`);
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          cancelButton.click();
        }
        if (event.metaKey) {
          const numeric = Number(event.key);
          if (Number.isInteger(numeric) && numeric > 0 && numeric <= visibleCards.length) {
            event.preventDefault();
            const card = visibleCards[numeric - 1];
            if (selected.has(card.id)) {
              selected.delete(card.id);
            } else {
              selected.add(card.id);
            }
            updateSelection();
            render();
          }
        }
      });

      updateSelection();
      render();
    </script>
  </body>
</html>
