name: Setup macOS build deps
description: Install + cache mise tools and GhosttyKit build outputs

runs:
  using: composite
  steps:
    - name: Mise cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/share/mise
          ~/.cache/mise
        key: ${{ runner.os }}-${{ runner.arch }}-mise-v0-${{ hashFiles('**/mise.toml', '**/.mise.toml', '**/.tool-versions', '**/.config/mise.toml', '**/mise/config.toml', '**/mise.lock', '**/.mise.lock', '**/mise/config.lock', '**/.config/mise.lock', '**/mise.*.toml', '**/.mise.*.toml', '**/.config/mise.*.toml', '**/mise.*.lock', '**/.mise.*.lock', '**/.config/mise.*.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-mise-v0-
    - run: brew install mise
      shell: bash
    - run: mise install
      shell: bash

    - name: Xcode cache identity
      shell: bash
      run: |
        set -euo pipefail
        XCODE_CACHE_ID="$(xcodebuild -version | awk '/Build version/ { print $3 }')"
        if [[ -z "$XCODE_CACHE_ID" ]]; then
          echo "error: failed to resolve Xcode build version" >&2
          exit 1
        fi
        printf '%s\n' "XCODE_CACHE_ID=$XCODE_CACHE_ID" >> "$GITHUB_ENV"
        echo "Xcode cache identity: $XCODE_CACHE_ID"

    - name: CLI SwiftPM build cache
      uses: actions/cache@v4
      with:
        path: |
          CLI/.build
          Mirror/Relay/.build
        key: ${{ runner.os }}-${{ runner.arch }}-cli-spm-v3-${{ env.XCODE_CACHE_ID }}-${{ hashFiles('CLI/Package.swift', 'CLI/Package.resolved', 'Shared/Package.swift', 'Mirror/Relay/Package.swift', 'Makefile', 'App/Config/Version.xcconfig', '.github/actions/setup-macos/action.yml', '.github/workflows/test.yml', 'scripts/ci-source-mtimes.py') }}-${{ hashFiles('CLI/Sources/**', 'CLI/Tests/**', 'Shared/Sources/**/*.swift', 'Mirror/Relay/Sources/**/*.swift', 'Mirror/Relay/Tests/**/*.swift') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-cli-spm-v3-${{ env.XCODE_CACHE_ID }}-${{ hashFiles('CLI/Package.swift', 'CLI/Package.resolved', 'Shared/Package.swift', 'Mirror/Relay/Package.swift', 'Makefile', 'App/Config/Version.xcconfig', '.github/actions/setup-macos/action.yml', '.github/workflows/test.yml', 'scripts/ci-source-mtimes.py') }}-
          ${{ runner.os }}-${{ runner.arch }}-cli-spm-v3-${{ env.XCODE_CACHE_ID }}-

    - name: Restore unchanged CLI source times
      shell: bash
      run: python3 scripts/ci-source-mtimes.py restore

    - name: Ghostty cache key
      shell: bash
      run: |
        set -euo pipefail
        GHOSTTY_SHA="$(git rev-parse HEAD:ThirdParty/ghostty)"
        printf '%s\n' "GHOSTTY_SHA=$GHOSTTY_SHA" >> "$GITHUB_ENV"
    - name: Ghostty cache
      id: ghostty_cache
      uses: actions/cache@v4
      with:
        path: |
          App/Frameworks/GhosttyKit.xcframework
          App/Resources/ghostty
          App/Resources/terminfo
          .ghostty_hash
          .ghostty_build_stamp
        key: ${{ runner.os }}-${{ runner.arch }}-ghostty-v2-${{ env.GHOSTTY_SHA }}
    - name: Ensure ghostty
      if: steps.ghostty_cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        make ensure-ghostty
    - name: Sync ghostty marker files
      shell: bash
      run: |
        set -euo pipefail
        printf '%s\n' "$GHOSTTY_SHA" > .ghostty_hash
        touch .ghostty_build_stamp

    - name: SPM cache
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/prowl-spm-cache/SourcePackages
        key: ${{ runner.os }}-${{ runner.arch }}-spm-v1-${{ hashFiles('.package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-spm-v1-

    - name: Xcode compilation cache
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
        # GitHub cache entries are immutable. A source-state suffix guarantees that a
        # successful changed build saves newly compiled objects; restore-keys select the
        # newest compatible CAS. Never restore across Xcode builds because compiler cache
        # keys and storage formats are toolchain-specific.
        key: ${{ runner.os }}-${{ runner.arch }}-xcode-compilation-cache-v3-${{ env.XCODE_CACHE_ID }}-${{ hashFiles('.package.resolved', 'Tuist.swift', 'Workspace.swift', 'App/Project.swift', 'App/Config/**', 'mise.toml', 'Makefile', '.github/actions/setup-macos/action.yml', '.github/workflows/test.yml') }}-${{ hashFiles('App/**/*.swift', 'Shared/Sources/**/*.swift', 'Mirror/Shared/*.swift', 'Mirror/Relay/Sources/**/*.swift') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-xcode-compilation-cache-v3-${{ env.XCODE_CACHE_ID }}-${{ hashFiles('.package.resolved', 'Tuist.swift', 'Workspace.swift', 'App/Project.swift', 'App/Config/**', 'mise.toml', 'Makefile', '.github/actions/setup-macos/action.yml', '.github/workflows/test.yml') }}-
          ${{ runner.os }}-${{ runner.arch }}-xcode-compilation-cache-v3-${{ env.XCODE_CACHE_ID }}-

    - name: App incremental cache identity
      shell: bash
      run: |
        set -euo pipefail
        # A changed file roster starts a fresh build to exclude stale source/resource outputs.
        APP_INPUT_PATHS_ID="$(git ls-files -z -- App Shared Mirror/Shared Mirror/Relay/Sources docs skills ThirdParty/git-wt | shasum -a 256 | cut -d ' ' -f 1)"
        APP_WORKSPACE_ID="$(pwd -P | shasum -a 256 | cut -d ' ' -f 1)"
        printf '%s\n' "APP_INPUT_PATHS_ID=$APP_INPUT_PATHS_ID" "APP_WORKSPACE_ID=$APP_WORKSPACE_ID" >> "$GITHUB_ENV"
    - name: App incremental build cache
      uses: actions/cache@v4
      with:
        path: ${{ env.PROWL_DERIVED_DATA_PATH }}
        # Incremental state needs a stricter boundary than the content-addressed cache.
        # Reuse across source edits, but not changed paths, build settings or toolchains.
        key: ${{ runner.os }}-${{ runner.arch }}-app-incremental-v2-${{ env.XCODE_CACHE_ID }}-${{ env.APP_WORKSPACE_ID }}-${{ env.GHOSTTY_SHA }}-${{ env.APP_INPUT_PATHS_ID }}-${{ hashFiles('CLI/Package.swift', 'CLI/Package.resolved', 'Shared/Package.swift', 'Mirror/Relay/Package.swift', '.package.resolved', 'Tuist.swift', 'Workspace.swift', 'App/Project.swift', 'App/Config/**', 'mise.toml', 'Makefile', '.github/actions/setup-macos/action.yml', '.github/workflows/test.yml', 'scripts/ci-source-mtimes.py') }}-${{ hashFiles('App/**/*.swift', 'Shared/Sources/**/*.swift', 'Mirror/Shared/*.swift', 'Mirror/Relay/Sources/**/*.swift') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-app-incremental-v2-${{ env.XCODE_CACHE_ID }}-${{ env.APP_WORKSPACE_ID }}-${{ env.GHOSTTY_SHA }}-${{ env.APP_INPUT_PATHS_ID }}-${{ hashFiles('CLI/Package.swift', 'CLI/Package.resolved', 'Shared/Package.swift', 'Mirror/Relay/Package.swift', '.package.resolved', 'Tuist.swift', 'Workspace.swift', 'App/Project.swift', 'App/Config/**', 'mise.toml', 'Makefile', '.github/actions/setup-macos/action.yml', '.github/workflows/test.yml', 'scripts/ci-source-mtimes.py') }}-
    - name: Restore unchanged App source times
      shell: bash
      run: python3 scripts/ci-source-mtimes.py restore --scope app --manifest "$PROWL_DERIVED_DATA_PATH/source-times.json"
