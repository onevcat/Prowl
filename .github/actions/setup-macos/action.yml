name: Setup macOS build deps
description: Install the Mise tools and restore the build caches. Run save-macos-caches at the end of the job to save them.

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-mise

    # The system mounts the Metal toolchain at a path with a random suffix on each boot. The path
    # is in the command line of many build tasks, so each runner invalidated them. Their rerun
    # relinks the macro plugins, and that recompiles the App and its tests (docs-ai 016.010).
    # After the unmount, Xcode finds the toolchain at a path that depends only on its content.
    # The system mounts it on first use, so ask for it before the unmount too.
    - name: Give the Metal toolchain a stable path
      shell: bash
      run: |
        xcodebuild -showComponent metalToolchain >/dev/null || true
        for mount in /var/run/com.apple.security.cryptexd/mnt/com.apple.MobileAsset.MetalToolchain-*; do
          [ -e "$mount" ] || continue
          sudo diskutil unmount force "$mount" || echo "Could not unmount $mount"
        done
        # A random path only makes the build slower, so report it and continue.
        toolchain="$(xcodebuild -showComponent metalToolchain 2>&1 || true)"
        echo "$toolchain"
        if grep -q 'cryptexd' <<<"$toolchain"; then
          echo "::warning::The Metal toolchain path is random, so incremental builds recompile the App."
        fi

    - uses: ./.github/actions/restore-cli-cache

    - name: Ghostty cache key
      shell: bash
      run: |
        set -euo pipefail
        GHOSTTY_SHA="$(git rev-parse HEAD:ThirdParty/ghostty)"
        printf '%s\n' "GHOSTTY_SHA=$GHOSTTY_SHA" >> "$GITHUB_ENV"
    - name: Ghostty cache
      id: ghostty_cache
      uses: actions/cache/restore@v4
      with:
        path: |
          App/Frameworks/GhosttyKit.xcframework
          App/Resources/ghostty
          App/Resources/terminfo
          .ghostty_hash
          .ghostty_build_stamp
        key: ${{ runner.os }}-${{ runner.arch }}-ghostty-v2-${{ env.GHOSTTY_SHA }}
    - name: Ensure ghostty
      if: steps.ghostty_cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        make ensure-ghostty
    - name: Sync ghostty marker files
      shell: bash
      run: |
        set -euo pipefail
        printf '%s\n' "$GHOSTTY_SHA" > .ghostty_hash
        touch .ghostty_build_stamp

    - name: SPM cache
      id: spm_cache
      uses: actions/cache/restore@v4
      with:
        path: ~/Library/Caches/prowl-spm-cache/SourcePackages
        key: ${{ runner.os }}-${{ runner.arch }}-spm-v3-${{ hashFiles('.package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-spm-v3-
          ${{ runner.os }}-${{ runner.arch }}-spm-v1-

    - name: App incremental cache identity
      shell: bash
      run: |
        set -euo pipefail
        APP_WORKSPACE_ID="$(pwd -P | shasum -a 256 | cut -d ' ' -f 1)"
        printf '%s\n' "APP_WORKSPACE_ID=$APP_WORKSPACE_ID" >> "$GITHUB_ENV"
    # Reuse across source edits and across added or deleted files: the build system handles
    # them (docs-ai 016.010). Start fresh only for another toolchain, GhosttyKit, package set
    # or project configuration. Build flags need no key part, because a task reruns when its
    # command line changes.
    - name: App incremental build cache
      id: app_cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.PROWL_DERIVED_DATA_PATH }}
        key: ${{ runner.os }}-${{ runner.arch }}-app-incremental-trialcold-${{ env.XCODE_CACHE_ID }}-${{ env.APP_WORKSPACE_ID }}-${{ env.GHOSTTY_SHA }}-${{ hashFiles('CLI/Package.swift', 'CLI/Package.resolved', 'Shared/Package.swift', 'Mirror/Relay/Package.swift', '.package.resolved', 'Tuist.swift', 'Workspace.swift', 'App/Project.swift', 'App/Config/**', 'mise.toml') }}-${{ hashFiles('App/**/*.swift', 'Shared/Sources/**/*.swift', 'Mirror/Shared/*.swift', 'Mirror/Relay/Sources/**/*.swift') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-app-incremental-trialcold-${{ env.XCODE_CACHE_ID }}-${{ env.APP_WORKSPACE_ID }}-${{ env.GHOSTTY_SHA }}-${{ hashFiles('CLI/Package.swift', 'CLI/Package.resolved', 'Shared/Package.swift', 'Mirror/Relay/Package.swift', '.package.resolved', 'Tuist.swift', 'Workspace.swift', 'App/Project.swift', 'App/Config/**', 'mise.toml') }}-
    - name: Restore unchanged App source times
      shell: bash
      run: python3 scripts/ci-source-mtimes.py restore --scope app --manifest "$PROWL_DERIVED_DATA_PATH/source-times.json"

    - name: Cache keys for save-macos-caches
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "PROWL_GHOSTTY_CACHE_KEY=${{ steps.ghostty_cache.outputs.cache-primary-key }}"
          echo "PROWL_GHOSTTY_CACHE_HIT=${{ steps.ghostty_cache.outputs.cache-hit }}"
          echo "PROWL_SPM_CACHE_KEY=${{ steps.spm_cache.outputs.cache-primary-key }}"
          echo "PROWL_SPM_CACHE_HIT=${{ steps.spm_cache.outputs.cache-hit }}"
          echo "PROWL_APP_CACHE_KEY=${{ steps.app_cache.outputs.cache-primary-key }}"
          echo "PROWL_APP_CACHE_HIT=${{ steps.app_cache.outputs.cache-hit }}"
        } >> "$GITHUB_ENV"
