name: mirror-android

# Check the Android client when it or the conversation fixtures its tests replay change, and for
# published releases. Android does not compile Mirror/Shared, so contract changes alone do not run it.
on:
  push:
    branches:
      - main
    paths:
      - Mirror/Android/**
      - Mirror/Fixtures/conversation/**
      - .github/workflows/mirror-android.yml
  pull_request:
    paths:
      - Mirror/Android/**
      - Mirror/Fixtures/conversation/**
      - .github/workflows/mirror-android.yml
  # Release tags are lightweight, so `git push --follow-tags` does not push them and
  # `gh release create` makes them on GitHub. That sends no tag push event.
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # November 2026 CSPU fixes CVE-2026-114938 (Java4Shell).
          java-version: '17.0.21.1+2'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build and test Android mirror
        working-directory: Mirror/Android
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
