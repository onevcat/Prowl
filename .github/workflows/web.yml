name: web

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v17
      - run: nix develop ./web -c bash -lc "cd web && bun install --frozen-lockfile"
      - run: nix develop ./web -c bash -lc "cd web && bun run check:deps"
      - run: nix develop ./web -c bash -lc "cd web && bun run typecheck"
      - run: nix develop ./web -c bash -lc "cd web && bun run lint"
      - run: nix develop ./web -c bash -lc "cd web && bun run test:web"
      - run: nix develop ./web -c bash -lc "cd web && bun run test"
      - run: nix develop ./web -c bash -lc "cd web && bun run build"
      - run: nix develop ./web -c bash -lc "cd web && bun run build:binaries"
      - run: nix develop ./web -c bash -lc "cd web && bun run check:bundle"
      - run: nix develop ./web -c bash -lc "cd web && bun run e2e"
      - uses: actions/upload-artifact@v4
        with:
          name: prowl-web-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/dist/bin/*
          if-no-files-found: error
          retention-days: 7
